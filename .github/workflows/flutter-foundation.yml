name: Flutter foundation

on:
  pull_request:
    paths: ['clients/flutter/**', 'docs/flutter-migration/evidence/A02/**', 'docs/flutter-migration/05-architecture-contracts.md', '.github/workflows/flutter-foundation.yml', '.gitattributes']
  push:
    paths: ['clients/flutter/**', 'docs/flutter-migration/evidence/A02/**', 'docs/flutter-migration/05-architecture-contracts.md', '.github/workflows/flutter-foundation.yml', '.gitattributes']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # Match the existing lockfile host; do not silently rewrite dependency sources.
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    defaults:
      run:
        shell: pwsh
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Obtain official pinned Flutter SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: flutter/flutter
          ref: c197ca5199e9ee5661e865596c9c07294dfab51c
          # Flutter derives its version from Git tags; a shallow SHA-only clone
          # reports 0.0.0-unknown and rejects the SDK's own test dependencies.
          fetch-depth: 0
          path: .ci-cache/flutter
          persist-credentials: false
      - name: Add Flutter to this job PATH
        run: |
          Join-Path $env:GITHUB_WORKSPACE '.ci-cache/flutter/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: JDK 21 for Android
        if: matrix.platform == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Versions
        run: flutter --version
      - name: Format, analysis and shared tests
        run: ./tool/check.ps1 -Mode Quality
      - name: Android diagnostic compile
        if: matrix.platform == 'android'
        run: flutter build apk --debug --no-pub --target lib/main.dart
      - name: Windows diagnostic compile
        if: matrix.platform == 'windows'
        run: ./tool/check.ps1 -Mode WindowsRelease
